name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: 打包 Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 打包（安装包 + 免安装版）
        run: npm run dist

      - name: 上传构建产物（每次 push 都能下载）
        uses: actions/upload-artifact@v4
        with:
          name: Lingo-TicketGrabber
          path: |
            dist/*.exe
          retention-days: 14

      - name: 打 tag 时发布 Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.exe --title "$GITHUB_REF_NAME" --generate-notes || \
            gh release upload "$GITHUB_REF_NAME" dist/*.exe --clobber
